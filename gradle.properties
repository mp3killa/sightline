# The IntelliJ Platform build runs on JDK 21. (Your PATH has no `java` at all; Android Studio's bundled
# JBR used to be the answer and no longer is.)
#
# This deliberately does NOT point into the Android Studio bundle any more. It used to
# (`/Applications/Android Studio.app/Contents/jbr/Contents/Home`), which meant an Android Studio update
# silently changed the build JDK: as of 2026-08-12 that bundle ships **JBR 25**, which Gradle 8.14.3
# refuses to run on, and it fails with a bare `* What went wrong: 25.0.2` — a message that names the JDK
# version and nothing else, so it reads like a broken checkout rather than an unsupported runtime.
#
# The path below is Gradle's own toolchain cache, which is the only JDK 21 on this machine. If Gradle
# prunes it, re-provision one (any JDK 21 will do) and repoint this line — but not back at the IDE
# bundle, which just re-arms the same trap on the next update.
#
# CI does not use this value: the workflow passes -Dorg.gradle.java.home=$JAVA_HOME after setup-java.
org.gradle.java.home=/Users/michael/.gradle/jdks/jetbrains_s_r_o_-21-aarch64-os_x.2/jbrsdk_jcef-21.0.10-osx-aarch64-b1163.108/Contents/Home

org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

# The IntelliJ Platform provides the Kotlin stdlib at runtime; don't bundle our own.
kotlin.stdlib.default.dependency=false
