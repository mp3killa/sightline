name: Build

# Every push to main and every pull request. This is the gate the release workflow assumes has
# already passed — it does not re-litigate correctness, it re-runs it against the tagged commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CI platform target. There is no Android Studio on a runner and `local()` cannot work, so the
  # build resolves a downloadable one instead — see build.gradle.kts.
  #
  # Why Android Studio and not IntelliJ IDEA Community: the build needs `org.jetbrains.android` on the
  # compile classpath for `ide/android/studio/StudioFactProvider`. **IC does not bundle it** — it ships
  # `android-gradle-dsl`, which is a different plugin — so an IC target cannot compile this project.
  #
  # It is fetched by `tools/fetch-android-studio.sh` and passed as `-PlocalIde`, NOT selected with
  # `-PplatformType=AI -PplatformVersion=…`: Google names the Quail downloads after the release codename
  # (`android-studio-quail2-linux.tar.gz`) while the Gradle plugin builds that URL from the version, so
  # no Quail build resolves by coordinate. The script's header has the detail.
  #
  # The fetched IDE is Android Studio Quail 2, platform build 261.25134.95 — the `sinceBuild` floor — so
  # CI compiles against the oldest platform the listing claims to support rather than a newer one that
  # would hide a break, and the verify job checks the artifact against that same IDE.
  AS_CACHE_DIR: /home/runner/.cache/sightline-verify

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # JDK 21: the platform requires it, and the project compiles to JVM 21 targets.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # gradle.properties pins `org.gradle.java.home` to a JDK 21 on the maintainer's machine, because a
      # developer's PATH java is typically 17 (or absent) while the platform needs 21. That path does not
      # exist on a runner and Gradle rejects it before any task runs. Override it with the JDK just
      # installed. Keeping the pin in gradle.properties is deliberate — it is correct for the machine it
      # describes, and it is deliberately NOT the Android Studio bundle any more: that made an IDE update
      # silently change the build JDK, which it did (AS now ships JBR 25, which Gradle 8.14 rejects).
      #
      # Computed in a step, not in `env:` above: JAVA_HOME is not known until setup-java has run, and
      # GitHub does not shell-expand `env:` values.
      - name: Point Gradle at the runner's JDK
        run: echo "JDK_ARG=-Dorg.gradle.java.home=$JAVA_HOME" >> "$GITHUB_ENV"

      # Cached across runs — the download is 1.5 GB. Keyed on the exact version, with no `restore-keys`:
      # a fuzzy restore would compile against a different IDE than this job claims to.
      - name: Cache Android Studio
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/sightline-verify/android-studio-2026.1.2.10
          key: android-studio-2026.1.2.10

      - name: Provision Android Studio
        run: echo "PLATFORM_ARGS=-PlocalIde=$(tools/fetch-android-studio.sh)" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew $JDK_ARG test $PLATFORM_ARGS

      - name: Build the plugin
        run: ./gradlew $JDK_ARG buildPlugin $PLATFORM_ARGS

      # The preview PNGs are the project's only automated visual channel (docs/TESTING.md). They are
      # written by the test task, not declared as task outputs, so they are collected here rather than
      # asserted on — a human still has to look at them.
      - name: Upload preview renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-renders
          path: |
            build/*.png
            build/marketplace/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 14

      - name: Upload the plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: sightline-plugin
          path: build/distributions/*.zip
          retention-days: 14

  verify:
    name: Plugin Verifier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build

    steps:
      - uses: actions/checkout@v7

      # Needed for the verifier itself, which resolves a JDK from the JAVA_HOME *environment variable*.
      # Gradle is deliberately not set up here: this job no longer builds anything.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Verify the artifact the build job already produced rather than building a second copy. The
      # script's SKIP_BUILD path exists for this.
      - name: Download the built plugin
        uses: actions/download-artifact@v8
        with:
          name: sightline-plugin
          path: build/distributions

      # The verifier needs a ~1.5 GB Android Studio tarball which expands to more than that. Only the
      # *extracted* IDE and the verifier jar are cached — not the tarball, which is redundant once
      # extracted and would roughly double the entry. `verify-plugin.sh` decides whether to download by
      # looking for `build.txt` in the extracted directory, so a hit skips the download and the extract.
      #
      # No `restore-keys` on purpose. The key pins the exact IDE and verifier versions; a fuzzy restore
      # would silently verify against a different IDE than the one this job claims to check.
      - name: Cache the verifier IDE
        uses: actions/cache@v6
        with:
          path: |
            /home/runner/.cache/sightline-verify/android-studio-2026.1.2.10
            /home/runner/.cache/sightline-verify/verifier-cli-1.388.jar
          key: verifier-ide-as-2026.1.2.10-cli-1.388

      # NOT `./gradlew verifyPlugin` — that task cannot resolve an IDE under IntelliJ Platform Gradle
      # Plugin 2.6.0 (it looks under group `idea` rather than `com.jetbrains.intellij.idea`). The script
      # fetches Android Studio itself and runs the same verifier CLI. See its header.
      - name: Verify against the sinceBuild floor
        env:
          VERIFY_WORK_DIR: /home/runner/.cache/sightline-verify
          SKIP_BUILD: "1"
        run: tools/verify-plugin.sh

      - name: Upload the verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifier-report
          path: /home/runner/.cache/sightline-verify/last-report.txt
          if-no-files-found: warn
          retention-days: 14
